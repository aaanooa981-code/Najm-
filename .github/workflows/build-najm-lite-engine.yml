name: NAJM Tube Independent V1.2 Player Fix
on:
  push:
    branches:
      - najm-tube-new-v12-player-fix
    paths:
      - 'engine-lite/**'
      - '.github/workflows/build-najm-lite-engine.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Android SDK diagnostics
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
      - name: Import approved official NAJM Tube icon
        run: |
          set -euo pipefail
          ICON=engine-lite/app/src/main/res/drawable-nodpi/najm_user_icon.png
          mkdir -p "$(dirname "$ICON")"
          if [ ! -s "$ICON" ]; then
            curl -fLsS --retry 3 --connect-timeout 12 --max-time 45 \
              "https://11a9516a-21ed-462b-bb1b-8bd26c438ed5.sandbox.floot.app/_cdn/static/f21b9214-ad7e-4e43-ad10-f7d6b662d13b-najm_tube_official_icon.png" \
              -o "$ICON"
          fi
          file "$ICON"
          test "$(stat -c%s "$ICON")" -gt 10000
      - name: Build independent APK
        run: gradle --project-dir engine-lite :app:assembleDebug --no-daemon --stacktrace
      - name: Source preflight for independent player and search
        run: |
          python3 - <<'PY'
          from pathlib import Path
          home=Path("engine-lite/app/src/main/java/com/najm/tubenew/HomeActivity.java").read_text()
          search=Path("engine-lite/app/src/main/java/com/najm/tubenew/YoutubeData.java").read_text()
          player=Path("engine-lite/app/src/main/java/com/najm/tubenew/VideoActivity.java").read_text()
          web=Path("engine-lite/app/src/main/java/com/najm/tubenew/WebPlayerActivity.java").read_text()
          manifest=Path("engine-lite/app/src/main/AndroidManifest.xml").read_text()
          assert "com.najm.tubenew" in manifest
          assert "YoutubeData.search(q)" in home
          assert "ytInitialData" in search and "SearchInfo.getInfo" in search
          assert "DashMediaSource.Factory" in player and "MergingMediaSource" in player
          assert "webFallback" in player and "WebView" in web
          print("Source preflight OK: new home/search/native player and optional fallback")
          PY
      - name: Validate APK format
        run: |
          test -s engine-lite/app/build/outputs/apk/debug/app-debug.apk
          unzip -t engine-lite/app/build/outputs/apk/debug/app-debug.apk | tail -2
          sha256sum engine-lite/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NAJM-Tube-Independent-V1.2-Player-Fix-APK
          path: engine-lite/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
      - name: Publish APK on isolated branch for direct download
        continue-on-error: true
        run: |
          mkdir -p downloads
          cp engine-lite/app/build/outputs/apk/debug/app-debug.apk downloads/NAJM-Tube-Independent-V1.2-Player-Fix.apk
          git config user.name "NAJM APK Builder"
          git config user.email "actions@users.noreply.github.com"
          git add downloads/NAJM-Tube-Independent-V1.2-Player-Fix.apk engine-lite/app/src/main/res/drawable-nodpi/najm_user_icon.png
          git commit -m "[skip ci] Attach independently built V1.2 APK" || true
          git push origin HEAD:najm-tube-new-v12-player-fix
