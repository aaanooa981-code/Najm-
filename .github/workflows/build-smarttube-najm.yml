      - name: Create NAJM Tube player controls, gestures, brand icon and name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zlib, struct, math
          root=Path('SmartTube/smarttubetv/src/main')
          java=root/'java/com/liskovsoft/smartyoutubetv2/tv/ui/playback'
          fragment=java/'PlaybackFragment.java'
          f=fragment.read_text()
          # Reuse original SmartTube playback transport actions; seek duration already exactly 10s.
          anchor='    private int getPlayerRowIndex() {'
          assert f.count(anchor)==1
          methods='''    // NAJM Tube player buttons delegate to the original SmartTube player glue.
              public void najmTogglePlayback() {
                  if (mPlayerGlue != null) mPlayerGlue.togglePlayback();
              }
              public void najmSeekTen(boolean forward) {
                  if (mPlayerGlue == null) return;
                  if (forward) mPlayerGlue.fastForward(); else mPlayerGlue.rewind();
              }
              public boolean najmPlaying() {
                  return mPlayerGlue != null && mPlayerGlue.isPlaying();
              }
              public long najmPosition() { return mPlayer != null ? Math.max(0, mPlayer.getCurrentPosition()) : 0; }
              public long najmDuration() { return mPlayer != null ? mPlayer.getDuration() : -1; }
              public void najmSeekTo(long milliseconds) {
                  if (mPlayer == null || milliseconds < 0) return;
                  long duration = najmDuration();
                  mPlayer.seekTo(duration > 0 ? Math.min(duration, milliseconds) : milliseconds);
              }

          '''
          f=f.replace(anchor,methods+anchor,1)
          # Force 10 seconds even if an old configuration preferred a longer increment.
          anchor='.seekSeconds(getPlayerData().getSeekIncrementMs() / 1_000)'
          assert f.count(anchor)==1
          f=f.replace(anchor,'.seekSeconds(10)',1)
          fragment.write_text(f)

          act=java/'PlaybackActivity.java'
          s=act.read_text()
          anchor='import android.view.MotionEvent;'
          assert s.count(anchor)==1
          s=s.replace(anchor,anchor+'''
          import android.view.GestureDetector;
          import android.view.View;
          import android.view.Gravity;
          import android.os.Handler;
          import android.os.Looper;
          import android.widget.SeekBar;
          import android.widget.TextView;
          import java.util.Locale;''',1)
          anchor='    private boolean mIsBackPressed;'
          assert s.count(anchor)==1
          s=s.replace(anchor,anchor+'''
              private GestureDetector mNajmGesture;
              private View mNajmControls;
              private TextView mNajmToggle;
              private TextView mNajmTiming;
              private SeekBar mNajmSeekBar;
              private final Handler mNajmHandler = new Handler(Looper.getMainLooper());
              private boolean mNajmDragging;
              private final Runnable mNajmDismiss = () -> {
                  if (mNajmControls != null) mNajmControls.setVisibility(View.GONE);
              };
              private final Runnable mNajmRefresh = new Runnable() {
                  @Override public void run() {
                      if (mPlaybackFragment != null && mNajmControls != null) {
                          long duration = mPlaybackFragment.najmDuration();
                          long position = mPlaybackFragment.najmPosition();
                          if (!mNajmDragging) {
                              mNajmSeekBar.setProgress((int) Math.min(position / 1000L, Integer.MAX_VALUE));
                              mNajmSeekBar.setMax((int) Math.max(1, Math.min(Math.max(0,duration)/1000L, Integer.MAX_VALUE)));
                          }
                          mNajmTiming.setText(najmClock(position) + " / " + najmClock(duration));
                          mNajmToggle.setText(mPlaybackFragment.najmPlaying() ? "Ⅱ" : "▶");
                      }
                      mNajmHandler.postDelayed(this, 800);
                  }
              };''',1)
          anchor='''        setContentView(R.layout.fragment_playback);
                  Fragment fragment ='''
          assert s.count(anchor)==1
          s=s.replace(anchor,'''        setContentView(R.layout.fragment_playback);
                  setupNajmPlayerControls();
                  Fragment fragment =''',1)
          anchor='''            mPlaybackFragment = (PlaybackFragment) fragment;
                  }
              }'''
          assert s.count(anchor)==1
          s=s.replace(anchor,'''            mPlaybackFragment = (PlaybackFragment) fragment;
                  }
                  mNajmHandler.post(mNajmRefresh);
              }''',1)
          anchor='''    @Override
              public boolean dispatchTouchEvent(MotionEvent event) {
                  if (mPlaybackFragment != null) {
                      mPlaybackFragment.onDispatchTouchEvent(event);
                  }

                  return super.dispatchTouchEvent(event);
              }'''
          assert s.count(anchor)==1
          s=s.replace(anchor,'''    @Override
              public boolean dispatchTouchEvent(MotionEvent event) {
                  // Run touch gestures before SmartTube's original screen controls.
                  if (mNajmGesture != null && mNajmGesture.onTouchEvent(event)) {
                      showNajmControls();
                      return true;
                  }
                  if (mPlaybackFragment != null) mPlaybackFragment.onDispatchTouchEvent(event);
                  boolean handled = super.dispatchTouchEvent(event);
                  if (event.getActionMasked() == MotionEvent.ACTION_UP) showNajmControls();
                  return handled;
              }''',1)
          anchor='''    @Override
              public void finishReally() {'''
          assert s.count(anchor)==1
          s=s.replace(anchor,'''    private void setupNajmPlayerControls() {
                  mNajmControls = findViewById(R.id.najm_player_controls);
                  mNajmToggle = findViewById(R.id.najm_player_toggle);
                  mNajmTiming = findViewById(R.id.najm_player_time);
                  mNajmSeekBar = findViewById(R.id.najm_player_seekbar);
                  mNajmControls.setVisibility(View.GONE);
                  findViewById(R.id.najm_player_back10).setOnClickListener(v -> {
                      if (mPlaybackFragment != null) mPlaybackFragment.najmSeekTen(false);
                      showNajmControls();
                  });
                  findViewById(R.id.najm_player_forward10).setOnClickListener(v -> {
                      if (mPlaybackFragment != null) mPlaybackFragment.najmSeekTen(true);
                      showNajmControls();
                  });
                  mNajmToggle.setOnClickListener(v -> {
                      if (mPlaybackFragment != null) mPlaybackFragment.najmTogglePlayback();
                      showNajmControls();
                  });
                  mNajmSeekBar.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      public void onStartTrackingTouch(SeekBar seekBar) { mNajmDragging = true; mNajmHandler.removeCallbacks(mNajmDismiss); }
                      public void onStopTrackingTouch(SeekBar seekBar) {
                          if (mPlaybackFragment != null) mPlaybackFragment.najmSeekTo(seekBar.getProgress()*1000L);
                          mNajmDragging = false;
                          showNajmControls();
                      }
                      public void onProgressChanged(SeekBar seekBar, int progress, boolean fromUser) {}
                  });
                  mNajmGesture = new GestureDetector(this, new GestureDetector.SimpleOnGestureListener() {
                      @Override public boolean onDown(MotionEvent e) { return false; }
                      @Override public boolean onDoubleTap(MotionEvent e) {
                          if (mPlaybackFragment == null) return false;
                          // YouTube gesture: double-tap right +10s / left -10s.
                          float proportion = e.getX() / Math.max(1f, getResources().getDisplayMetrics().widthPixels);
                          if (proportion >= .65f) mPlaybackFragment.najmSeekTen(true);
                          else if (proportion <= .35f) mPlaybackFragment.najmSeekTen(false);
                          else mPlaybackFragment.najmTogglePlayback();
                          return true;
                      }
                  });
              }
              private void showNajmControls() {
                  if (mNajmControls == null) return;
                  mNajmControls.setVisibility(View.VISIBLE);
                  mNajmHandler.removeCallbacks(mNajmDismiss);
                  mNajmHandler.postDelayed(mNajmDismiss, 3800);
              }
              private static String najmClock(long timeMs) {
                  if (timeMs < 0) return "00:00";
                  long seconds=timeMs/1000;
                  if (seconds >= 3600) return String.format(Locale.US,"%d:%02d:%02d",seconds/3600,(seconds/60)%60,seconds%60);
                  return String.format(Locale.US,"%02d:%02d",seconds/60,seconds%60);
              }
              @Override protected void onDestroy() {
                  mNajmHandler.removeCallbacks(mNajmRefresh);
                  mNajmHandler.removeCallbacks(mNajmDismiss);
                  super.onDestroy();
              }

              @Override
              public void finishReally() {''',1)
          act.write_text(s)

