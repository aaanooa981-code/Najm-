                  </LinearLayout>
              </FrameLayout>
          </FrameLayout>''')
          (root/'res/drawable/najm_player_dock.xml').write_text('''<shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#C9111111"/><corners android:radius="23dp"/></shape>''')
          (root/'res/values/najm_player.xml').write_text('''<resources><style name="NajmTube.PlayerControl" parent="@android:style/Widget.TextView"><item name="android:layout_width">100dp</item><item name="android:layout_height">72dp</item><item name="android:gravity">center</item><item name="android:clickable">true</item><item name="android:focusable">true</item><item name="android:background">?android:attr/selectableItemBackground</item><item name="android:textColor">#FFFFFF</item><item name="android:textSize">23sp</item><item name="android:textStyle">bold</item></style></resources>''')

          strings=root/'res/values/strings.xml'
          t=strings.read_text()
          assert '<![CDATA[SmartTube]]>' in t
          t=t.replace('<![CDATA[SmartTube]]>', '<![CDATA[NAJM Tube]]>', 2)
          strings.write_text(t)
          manifest=root/'AndroidManifest.xml'
          t=manifest.read_text()
          assert t.count('android:icon="@mipmap/app_icon"') == 1
          assert t.count('android:banner="@mipmap/app_banner"') == 1
          t=t.replace('android:icon="@mipmap/app_icon"', 'android:icon="@mipmap/najm_tube_icon"',1)
          t=t.replace('android:logo="@mipmap/app_logo"', 'android:logo="@mipmap/najm_tube_icon"',1)
          t=t.replace('android:banner="@mipmap/app_banner"', 'android:banner="@mipmap/najm_tube_banner"',1)
          manifest.write_text(t)
          home=root/'res/layout/fragment_main.xml'
          t=home.read_text()
          assert 'SmartTube' in t
          home.write_text(t.replace('SmartTube','NAJM Tube'))
          theme=root/'res/values/najm_home_theme.xml'
          t=theme.read_text().replace('name="cardSelectedBackground">@color/najm_panel','name="cardSelectedBackground">@color/najm_panel')
          t=t.replace('</style></resources>','<item name="appLogo">@mipmap/najm_tube_icon</item></style></resources>')
          theme.write_text(t)
          # Generate PNGs with only Python's standard library (Android 4.4-compatible bitmap resources).
          def png(path,w,h,pixel):
              raw=bytearray()
              for y in range(h):
                  raw.append(0)
                  for x in range(w): raw.extend(pixel(x,y))
              def chunk(t,b): return struct.pack('!I',len(b))+t+b+struct.pack('!I',zlib.crc32(t+b)&0xffffffff)
              data=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('!2I5B',w,h,8,6,0,0,0))+chunk(b'IDAT',zlib.compress(bytes(raw),9))+chunk(b'IEND',b'')
              path.write_bytes(data)
          def rounded(x,y,x1,y1,x2,y2,r):
              cx=min(max(x,x1+r),x2-r);cy=min(max(y,y1+r),y2-r)
              return (x-cx)**2+(y-cy)**2<=r*r
          def icon_px(x,y):
              if not rounded(x,y,7,7,185,185,35):return (0,0,0,0)
              if rounded(x,y,22,22,170,170,29):base=(21,21,25,255)
              else:base=(6,8,13,255)
              if rounded(x,y,29,51,164,140,27):base=(240,21,55,255)
              if 83<=x<=122 and abs(y-95)<(124-x)*.62:base=(255,255,255,255)
              return base
          res=root/'res/mipmap-nodpi'
          png(res/'najm_tube_icon.png',192,192,icon_px)
          def banner_px(x,y):
              if rounded(x,y,0,0,320,180,16):base=(13,15,22,255)
              else:return (0,0,0,0)
              if rounded(x,y,32,42,158,140,25):base=(240,21,55,255)
              if 79<=x<=125 and abs(y-91)<(127-x)*.55:base=(255,255,255,255)
              # Distinctive gold underline to brand the TV launcher banner.
              if 181<x<304 and 135<y<141:base=(197,163,82,255)
              return base
          png(res/'najm_tube_banner.png',320,180,banner_px)
          print('Prepared NAJM Tube video controls, 10-second double taps, timeline, new identity')
          PY
      - name: One-tap touch navigation and clean video-only search results
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('SmartTube/smarttubetv/src/main/java/com/liskovsoft/smartyoutubetv2/tv')
          # Hide the irrelevant autocomplete/tag chips, without affecting video search.
          search=root/'ui/search/tags/vineyard/SearchTagsFragmentBase.java'
          s=search.read_text()
          anchor='''    protected void loadSearchTags(String searchQuery) {
                  searchTaggedPosts(searchQuery);
              }'''
          assert s.count(anchor)==1, "Search suggestions layout changed unexpectedly"
          s=s.replace(anchor,'''    protected void loadSearchTags(String searchQuery) {
                  // NAJM: No separate suggestions rows; keep only real video search results.
                  clearTags();
              }''',1)
          search.write_text(s)

          # The upstream sidebar only opens on the SECOND click when it is focused.
          sidebar=root/'ui/browse/BrowseFragment.java'
          s=sidebar.read_text()
          old='''                    if (getHeadersSupportFragment().getSelectedPosition() != newPosition) {
                                  // touch screen support
                                  getHeadersSupportFragment().setSelectedPosition(newPosition);
                              } else {
                                  // update section when clicked or pressed
                                  mBrowsePresenter.onSectionFocused((int) headerId);
                                  startHeadersTransitionSafe(false);
                              }'''
          assert s.count(old)==1, 'sidebar touch code changed upstream'
          s=s.replace(old,'''                    // Touch: navigate on the first tap.
                              getHeadersSupportFragment().setSelectedPosition(newPosition);
                              mBrowsePresenter.onSectionFocused((int) headerId);
                              startHeadersTransitionSafe(false);''',1)
          sidebar.write_text(s)

          # Leanback RecyclerView cards can treat the first tap as focus selection.
          # Explicitly dispatch a single click on a short tap of a click-enabled item,
          # without changing Android remote DPAD or player's double-tap handling.
          activity=root/'ui/common/LeanbackActivity.java'
          s=activity.read_text()
          anchor='import android.view.KeyEvent;'
          assert s.count(anchor)==1
          s=s.replace(anchor, anchor+'''
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.ViewConfiguration;
          import android.graphics.Rect;
          import androidx.recyclerview.widget.RecyclerView;''',1)
          anchor='    private UriBackgroundManager mBackgroundManager;'
          assert s.count(anchor)==1
          s=s.replace(anchor, anchor+'''
              private View mNajmTouchTarget;
              private float mNajmTouchDownX, mNajmTouchDownY;
              private long mNajmTouchDownTime;
              private boolean mNajmTouchMoved;
              private View findNajmTouchTarget(View view, int rawX, int rawY, boolean inGrid) {
                  if (view == null || view.getVisibility() != View.VISIBLE) return null;
                  Rect rect = new Rect();
                  if (!view.getGlobalVisibleRect(rect) || !rect.contains(rawX,rawY)) return null;
                  boolean inside = inGrid || view instanceof RecyclerView;
                  if (view instanceof ViewGroup) {
                      ViewGroup group=(ViewGroup)view;
                      for (int i=group.getChildCount()-1;i>=0;i--) {
                          View hit=findNajmTouchTarget(group.getChildAt(i),rawX,rawY,inside);
                          if (hit != null) return hit;
                      }
                  }
                  return inside && (view.hasOnClickListeners() || view.isClickable()) && !(view instanceof RecyclerView)
                      ? view : null;
              }
              @Override public boolean dispatchTouchEvent(MotionEvent event) {
                  // Retain native touch gestures in video playback, especially double-tap seek.
                  if (this instanceof PlaybackActivity) return super.dispatchTouchEvent(event);
                  if (event.getToolType(0) != MotionEvent.TOOL_TYPE_FINGER
                      || event.getPointerCount() != 1) {
                      mNajmTouchTarget = null;
                      return super.dispatchTouchEvent(event);
                  }
                  int action=event.getActionMasked();
                  if (action==MotionEvent.ACTION_DOWN) {
                      mNajmTouchDownX=event.getRawX();
                      mNajmTouchDownY=event.getRawY();
                      mNajmTouchDownTime=event.getEventTime();
                      mNajmTouchMoved=false;
                      mNajmTouchTarget=findNajmTouchTarget(
                          getWindow().getDecorView(),(int)mNajmTouchDownX,(int)mNajmTouchDownY,false);
                  } else if (action==MotionEvent.ACTION_MOVE && mNajmTouchTarget!=null) {
                      float deltaX=event.getRawX()-mNajmTouchDownX;
                      float deltaY=event.getRawY()-mNajmTouchDownY;
                      int slop=ViewConfiguration.get(this).getScaledTouchSlop();
                      if (deltaX*deltaX+deltaY*deltaY > slop*slop) mNajmTouchMoved=true;
                  } else if (action==MotionEvent.ACTION_UP) {
                      View target=mNajmTouchTarget;
                      mNajmTouchTarget=null;
                      float dx=event.getRawX()-mNajmTouchDownX;
                      float dy=event.getRawY()-mNajmTouchDownY;
                      int slop=ViewConfiguration.get(this).getScaledTouchSlop();
                      boolean isTap=!mNajmTouchMoved && dx*dx+dy*dy<=slop*slop
                          && event.getEventTime()-mNajmTouchDownTime < 450;
                      if (isTap && target!=null
                          && target.isShown() && target.isEnabled()
                          && target==findNajmTouchTarget(getWindow().getDecorView(),
                              (int)event.getRawX(),(int)event.getRawY(),false)) {
                          // Cancel the ordinary focus-only touch sequence, then click ONCE.
                          MotionEvent cancel=MotionEvent.obtain(event);
                          cancel.setAction(MotionEvent.ACTION_CANCEL);
                          super.dispatchTouchEvent(cancel);
                          cancel.recycle();
                          target.requestFocus();
                          target.performClick();
                          return true;
                      }
                  } else if (action==MotionEvent.ACTION_CANCEL || action==MotionEvent.ACTION_POINTER_DOWN) {
                      mNajmTouchTarget=null;
                  }
                  return super.dispatchTouchEvent(event);
              }''',1)
          # Current LeanbackActivity already imports PlaybackActivity; reference can compile.
          assert 'import com.liskovsoft.smartyoutubetv2.tv.ui.playback.PlaybackActivity;' in s
          activity.write_text(s)
          # Avoid Android view focus trap on image cards.
          card=root/'presenter/VideoCardPresenter.java'
          s=card.read_text()
          assert s.count('cardView.setFocusableInTouchMode(true);')==1
          card.write_text(s.replace('cardView.setFocusableInTouchMode(true);','cardView.setFocusableInTouchMode(false);',1))
          # Sidebar row must be clickable without long focus acquisition.
          icons=Path('SmartTube/smarttubetv/src/main/res/layout/icon_header_item.xml')
          s=icons.read_text()
          anchor='    android:orientation="horizontal">'
          assert s.count(anchor)==1
          icons.write_text(s.replace(anchor,'    android:orientation="horizontal"\n    android:focusableInTouchMode="false">',1))
          print('Single-tap navigation: modified search, sidebar, video cards and touch dispatch.')
          PY
