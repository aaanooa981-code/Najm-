name: NAJM Tube V2.4 Fast Start Arabic
on:
  push:
    branches:
      - najm-tube-v2-4-fast-start
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled runner Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          ls /usr/local/lib/android/sdk
      - name: Fetch exact SmartTube 32.03 source and dependencies
        run: |
          git clone --recurse-submodules https://github.com/yuliskov/SmartTube.git SmartTube
          cd SmartTube
          git checkout aafa3bc
          git submodule update --init --recursive
      - name: Apply YouTube-like home, preserve playback and data engine
        run: |
          python3 - <<'PY'
